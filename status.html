<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MRT Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="./images/resources/Favicon.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="City Loopers MRT status">
    <script src="./js/main.js" defer></script>
</head>
<body class="bg-gray-100">

<nav class="bg-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between">
            <div class="flex space-x-7">
                <div>
                    <!-- Website Logo -->
                    <a href="/" class="flex items-center py-4 px-2">
                        <img src="./images/resources/Favicon.png" alt="Logo" class="h-8 w-8 mr-2">
                        <span class="font-semibold text-gray-500 text-lg">City Loopers</span>
                    </a>
                </div>
                <!-- Primary Navbar items -->
                <div class="hidden md:flex items-center space-x-1" id="navbar">
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container mx-auto p-4">
    <h1 class="text-4xl font-bold text-center my-8">MRT Status</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="h-4 bg-blue-400 rounded-full"></div>
            <h2 class="text-2xl font-bold mt-4">North South Line</h2>
            <p class="text-lg font-bold"><span id="line-north-south" class="line-status"></span></p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="h-4 bg-purple-600 rounded-full"></div>
            <h2 class="text-2xl font-bold mt-4">East West Line</h2>
            <p class="text-lg font-bold"><span id="line-east-west" class="line-status"></span></p>
            <p>Buses replace trains on the East West Line <a href="./lines/east-west.html" class="text-blue-500 hover:underline">More Info</a></p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="h-4 bg-orange-500 rounded-full"></div>
            <h2 class="text-2xl font-bold mt-4">North West Line</h2>
            <p class="text-lg font-bold"><span id="line-north-west" class="line-status"></span></p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="h-4 bg-teal-500 rounded-full"></div>
            <h2 class="text-2xl font-bold mt-4">North East Line</h2>
            <p class="text-lg font-bold"><span id="line-north-east" class="line-status"></span></p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="h-4 bg-blue-600 rounded-full"></div>
            <h2 class="text-2xl font-bold mt-4">South East Line</h2>
            <p class="text-lg font-bold"><span id="line-south-east" class="line-status"></span></p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="h-4 bg-pink-500 rounded-full"></div>
            <h2 class="text-2xl font-bold mt-4">South West Line</h2>
            <p class="text-lg font-bold"><span id="line-south-west" class="line-status"></span></p>
        </div>
    </div>
</div>
<footer class="bg-white shadow-lg mt-8">
    <div class="max-w-6xl mx-auto px-4 py-2 text-center text-gray-500">
        <p>&copy; 2024 City Loopers</p>
    </div>
</footer>
</body>
</html>
